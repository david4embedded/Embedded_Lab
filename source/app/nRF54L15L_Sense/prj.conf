CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP23=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_HWINFO=y

# PDM microphone
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

CONFIG_MAIN_STACK_SIZE=4096

# Shell on the console UART (uart20); imu/mic commands run on the shell thread
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096

# Driver errors and fatal error (fault) dumps are printed through the shell log backend
CONFIG_LOG=y
